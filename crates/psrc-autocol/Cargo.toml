[package]
name = "autocol"
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reversible, schema-free auto-columnar transform: reshape line-oriented data so a general compressor (zstd/brotli) sees per-column-homogeneous streams. A pre-pass, not a compressor. decode(encode(x)) == x."
readme = "README.md"
keywords = ["compression", "columnar", "transform", "logs", "preprocessing"]
categories = ["compression", "encoding"]
repository = "https://github.com/gitspoked/autocol"
authors = ["Matt Klein <mk@ntele.net>"]

[dependencies]

[dev-dependencies]
proptest = { workspace = true }
